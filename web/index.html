<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesh MQTT Bridge</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#fff; --panel2:#f0f3f6; --text:#1c2530; --muted:#66727f; --line:#dde3e9;
  --accent:#1f7a4d; --accent-t:#fff; --ok:#1f8a4c; --warn:#b7791f; --bad:#c0392b; --info:#2b6cb0;
  --warn-bg:#fff6e0; --bad-bg:#fdecea; --ok-bg:#e6f5ec; --info-bg:#e8f1fb; --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12171c; --panel:#1b2229; --panel2:#232c35; --text:#e6ebf0; --muted:#8f9ba8; --line:#2c3742;
    --accent:#3fb37a; --accent-t:#0c1a12; --ok:#4cc582; --warn:#e0a94a; --bad:#ee7263; --info:#6aa9ec;
    --warn-bg:#33290f; --bad-bg:#3a1c19; --ok-bg:#12301f; --info-bg:#14263a; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
header .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill.ok .dot{background:var(--ok)} .pill.warn .dot{background:var(--warn)} .pill.bad .dot{background:var(--bad)}
.layout{display:flex;min-height:calc(100vh - 53px)}
nav{width:190px;flex:none;padding:12px 8px;border-right:1px solid var(--line);background:var(--panel)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:550}
nav button:hover{background:var(--panel2)}
nav button.on{background:var(--panel2);color:var(--text)}
nav button .badge{float:right;background:var(--accent);width:9px;height:9px;border-radius:50%;margin-top:6px}
main{flex:1;min-width:0;padding:16px 20px 90px;max-width:1100px}
h2{font-size:18px;margin:0 0 4px} .sub{color:var(--muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:650}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.big{font-size:26px;font-weight:650;line-height:1.1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner{padding:10px 14px;border-radius:10px;margin:0 0 14px;border:1px solid var(--line);background:var(--panel)}
.banner.warn{background:var(--warn-bg);border-color:var(--warn)} .banner.bad{background:var(--bad-bg);border-color:var(--bad)}
.banner.ok{background:var(--ok-bg);border-color:var(--ok)} .banner.info{background:var(--info-bg);border-color:var(--info)}
.banner ul{margin:6px 0 0 18px;padding:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)} th{color:var(--muted);font-weight:600}
td.mono,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.btn{background:var(--panel2);border:1px solid var(--line);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(.97)} .btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.field{display:grid;grid-template-columns:minmax(150px,1fr) minmax(160px,1.2fr);gap:8px 16px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .lbl{font-weight:550} .field .help{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:1px}
.field.changed{box-shadow:inset 3px 0 0 var(--accent);padding-left:10px;margin-left:-13px}
.field .ctl{justify-self:end;width:100%;max-width:340px}
.field .ctl.tog{width:auto}
input[type=text],input[type=password],input[type=number],select{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input:disabled,select:disabled{opacity:.6}
.sw{position:relative;display:inline-block;width:44px;height:24px}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:999px;cursor:pointer;transition:.15s}
.sw span::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--accent)} .sw input:checked+span::before{transform:translateX(20px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sw input:disabled+span{opacity:.5;cursor:default}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.tag.primary{color:var(--ok);border-color:var(--ok)} .tag.secondary{color:var(--info);border-color:var(--info)}
.savebar{position:fixed;left:190px;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:12px;align-items:center;z-index:6;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.savebar .msg{flex:1;min-width:0}
.savebar[hidden]{display:none}
#logtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
#logtools select,#logtools input[type=text]{width:auto}
#logbox{background:#0e1318;color:#d6dde4;border-radius:10px;padding:8px 10px;height:calc(100vh - 230px);min-height:260px;overflow:auto;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#logbox div{white-space:pre-wrap;word-break:break-word}
#logbox .t{color:#71808f} #logbox .WARNING{color:#f0c060} #logbox .ERROR,#logbox .CRITICAL{color:#ff8478} #logbox .DEBUG{color:#8595a4}
#logbox .MAP{color:#6fdc9c}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 8px}
.hint{color:var(--muted);font-size:12.5px}
.chan-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.chan-head .name{font-size:16px;font-weight:650}
/* nodes */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=text]{flex:1;min-width:180px;width:auto} .toolbar select{width:auto}
.toolbar label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);cursor:pointer;white-space:nowrap}
.toolbar label.chk input{width:auto}
.summary{color:var(--muted);margin:0 0 10px}
table.nodes{font-size:14px} table.nodes td{vertical-align:middle;padding:7px 8px;white-space:nowrap}
table.nodes tr.node{cursor:pointer} table.nodes tr.node:hover{background:var(--panel2)}
table.nodes tr.me{background:var(--ok-bg)}
table.nodes tr.detail td{background:var(--panel2);padding:10px 14px}
table.nodes tr.dim td{opacity:.55}
.avatar{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:28px;padding:0 6px;border-radius:8px;font-size:12px;font-weight:650;white-space:nowrap}
.nm{display:flex;gap:10px;align-items:center}
.nm .t{min-width:0} .nm .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.nm .t span{color:var(--muted);font-size:12px}
.star{color:#f0a500}
.snr.ok{color:var(--ok)} .snr.warn{color:var(--warn)} .snr.bad{color:var(--bad)}
.arrow{display:inline-block;font-size:13px;color:var(--muted);margin-left:6px}
.lock{color:var(--ok)} .lock.open{color:var(--warn)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 18px;font-size:13px}
.dgrid div span{color:var(--muted);display:block;font-size:12px}
@media (max-width:760px){
  .hide-sm{display:none} .nm .t b{max-width:150px}
  .layout{display:block} nav{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  nav button{white-space:nowrap;width:auto} main{padding:14px 12px 100px}
  #nodename{display:none} .savebar{left:0} .field{grid-template-columns:1fr} .field .ctl{justify-self:stretch;max-width:none} .field .ctl.tog{justify-self:start}
}
</style>
</head>
<body>
<header>
  <h1>Mesh MQTT Bridge</h1>
  <span id="nodename" class="hint"></span>
  <span class="sp"></span>
  <span id="pill" class="pill"><span class="dot"></span><span id="pilltext">Loading</span></span>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="savebar" class="savebar" hidden></div>
<div id="modal"></div>

<script>
"use strict";
/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value" || k === "checked" || k === "disabled" || k === "selected") e[k] = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  let j = null;
  try { j = await r.json(); } catch (_) { /* not JSON */ }
  if (!r.ok) { const e = new Error((j && j.error) || r.statusText); e.status = r.status; e.data = j; throw e; }
  return j;
}
const post = (p, b) => api(p, { method: "POST", headers: { "Content-Type": "application/json", "X-Requested-With": "mesh-ui" }, body: JSON.stringify(b || {}) });
const clone = o => JSON.parse(JSON.stringify(o));
function dur(s) {
  s = Math.max(0, Math.round(s));
  const d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d}d ${hh}h`; if (hh) return `${hh}h ${m}m`; if (m) return `${m}m ${s % 60}s`; return `${s}s`;
}
const ago = t => t ? dur(Date.now() / 1000 - t) + " ago" : "never";
const clock = t => new Date(t * 1000).toLocaleTimeString([], { hour12: false });
const getp = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
function setp(o, p, v) { const ks = p.split("."); const last = ks.pop(); const t = ks.reduce((a, k) => a[k], o); t[last] = v; }

/* ---------- state ---------- */
const S = {
  tab: "dashboard", status: null, statusErr: null,
  orig: null, draft: null, settingsErr: null, settingsLoading: false,
  notice: null,             // banner after saving
  awaitReload: false,       // settings must be re-read once the node is back
  logs: [], lastLog: 0, logLevel: "INFO", logFilter: "", logPaused: false,
};
const TABS = [["dashboard", "Dashboard"], ["nodes", "Nodes"], ["mqtt", "MQTT & Map"], ["channels", "Channels"], ["device", "Device"], ["logs", "Logs"]];

function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (_) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (_) { /* storage blocked: fine */ } }
Object.assign(S, { nodes: null, nodesErr: null, nodeQuery: "", nodeOpen: new Set(),
  nodeSort: lsGet("nodeSort", "heard"), nodeOnline: lsGet("nodeOnline", "0") === "1", units: lsGet("units", "mi") });

/* ---------- payload / diff ---------- */
const MQTT_STR = ["address", "username", "root"];
function buildPayload() {
  if (!S.orig || !S.draft) return {};
  const p = {}, o = S.orig, d = S.draft;
  const put = (path, v) => { const ks = path.split("."); const last = ks.pop(); let t = p; for (const k of ks) t = t[k] = t[k] || {}; t[last] = v; };
  const cmp = path => { const a = getp(o, path), b = getp(d, path); if (a !== b) put(path, b); };
  for (const k of ["enabled", "proxy_to_client_enabled", "map_reporting_enabled", "encryption_enabled", "json_enabled", "tls_enabled", ...MQTT_STR]) cmp("mqtt." + k);
  for (const k of ["publish_interval_secs", "position_precision", "should_report_location"]) cmp("mqtt.map_report_settings." + k);
  if (d.mqtt.password) put("mqtt.password", d.mqtt.password);
  cmp("lora.config_ok_to_mqtt");
  for (const c of o.channels) for (const k of ["uplink_enabled", "downlink_enabled", "position_precision"]) {
    const a = c[k], b = d.chByIdx[c.index][k]; if (a !== b) put(`channels.${c.index}.${k}`, b);
  }
  if (o.owner.known || d.owner.long_name || d.owner.short_name) {
    if (d.owner.long_name !== o.owner.long_name && d.owner.long_name) put("owner.long_name", d.owner.long_name);
    if (d.owner.short_name !== o.owner.short_name && d.owner.short_name) put("owner.short_name", d.owner.short_name);
  }
  return p;
}
const countChanges = p => { let n = 0; const walk = x => { for (const v of Object.values(x)) (v && typeof v === "object") ? walk(v) : n++; }; walk(p); return n; };

function newDraft(s) {
  const d = clone(s);
  d.mqtt.password = "";
  d.chByIdx = {}; for (const c of d.channels) d.chByIdx[c.index] = c;
  return d;
}

/* ---------- live hints (server re-checks on save) ---------- */
function hints() {
  const out = [], d = S.draft; if (!d) return out;
  const m = d.mqtt, rs = m.map_report_settings;
  if (m.map_reporting_enabled) {
    if (!m.enabled || !m.proxy_to_client_enabled) out.push("Map reporting is on, but MQTT or the client proxy is off, so nothing will be sent.");
    if (!rs.should_report_location) out.push("Map reporting is on but \"Share location\" is off; the node will probably not send reports.");
    if (!d.lora.config_ok_to_mqtt) out.push("\"OK to MQTT\" is off; meshmap.net lists it as a requirement.");
    if (rs.position_precision !== 0 && (rs.position_precision < 10 || rs.position_precision > 16)) out.push("meshmap.net accepts map precision of 10-16 bits (23.3 km to 364 m).");
    if (rs.position_precision === 0) out.push("Precision 0 means your location is not shared, so you will not appear on the map.");
  }
  for (const c of d.channels) {
    if (c.uplink_enabled && c.role !== "PRIMARY") out.push(`Channel ${c.index} (${c.name || "unnamed"}) has uplink on and is not the primary channel: its traffic goes to the MQTT server.`);
    if (c.uplink_enabled && c.position_precision === 32) out.push(`Channel ${c.index} shares exact positions and has uplink on.`);
  }
  return out;
}

/* ---------- field builders ---------- */
function fieldRow(label, help, ctl, path, tog) {
  return h("div", { class: "field", "data-path": path || "" },
    h("div", { class: "lbl" }, label, help ? h("span", { class: "help" }, help) : null),
    h("div", { class: "ctl" + (tog ? " tog" : "") }, ctl));
}
function toggle(path, label, help, opts = {}) {
  const box = h("input", { type: "checkbox", checked: !!getp(S.draft, path), disabled: opts.disabled, onchange: e => { setp(S.draft, path, e.target.checked); afterEdit(); } });
  return fieldRow(label, help, h("label", { class: "sw" }, box, h("span")), path, true);
}
function text(path, label, help, opts = {}) {
  const inp = h("input", { type: opts.password ? "password" : "text", value: getp(S.draft, path) ?? "", placeholder: opts.placeholder || "", maxlength: opts.max, autocomplete: "off", spellcheck: "false",
    oninput: e => { setp(S.draft, path, e.target.value); afterEdit(); } });
  return fieldRow(label, help, inp, path);
}
function select(path, label, help, options, numeric = true) {
  const cur = getp(S.draft, path);
  const opts = options.slice(); if (!opts.some(o => o[0] === cur)) opts.push([cur, String(cur)]);
  const sel = h("select", { onchange: e => { setp(S.draft, path, numeric ? Number(e.target.value) : e.target.value); afterEdit(); } },
    opts.map(([v, l]) => h("option", { value: v, selected: v === cur }, l)));
  return fieldRow(label, help, sel, path);
}
const precisionOpts = () => Object.keys(S.orig.precision_text).map(Number).sort((a, b) => a - b)
  .map(b => [b, b === 0 ? "0 - location not shared" : b === 32 ? "32 - exact" : `${b} bits - about ${S.orig.precision_text[b]}`]);
const intervalOpts = [[3600, "Every hour"], [7200, "Every 2 hours"], [10800, "Every 3 hours"], [21600, "Every 6 hours"], [43200, "Every 12 hours"], [86400, "Every day"]];

/* mark changed fields (dot after label) without rebuilding the form, so typing keeps focus */
function refreshMarks() {
  if (!S.orig) return;
  const p = buildPayload();
  const flat = new Set(); const walk = (x, pre) => { for (const [k, v] of Object.entries(x)) (v && typeof v === "object") ? walk(v, pre + k + ".") : flat.add(pre + k); }; walk(p, "");
  document.querySelectorAll(".field[data-path]").forEach(el => {
    const path = el.dataset.path; if (!path) return;
    let key = path;
    if (path.startsWith("chByIdx.")) key = "channels." + path.slice(8);
    el.classList.toggle("changed", flat.has(key));
  });
}
function afterEdit() { refreshMarks(); renderSaveBar(); renderNavBadge(); const hb = $("#hintbox"); if (hb) fillHints(hb); }
function fillHints(el) {
  el.replaceChildren();
  const hs = hints();
  if (hs.length) el.append(h("div", { class: "banner warn" }, h("b", {}, "Heads up"), h("ul", {}, hs.map(x => h("li", {}, x)))));
}

/* ---------- save flow ---------- */
function renderSaveBar() {
  const bar = $("#savebar"); const n = countChanges(buildPayload());
  bar.hidden = n === 0;
  if (!n) return;
  bar.replaceChildren(
    h("div", { class: "msg" }, h("b", {}, `${n} unsaved change${n > 1 ? "s" : ""}`), h("div", { class: "hint" }, "Saving reboots the node (about 30 seconds); the proxy reconnects by itself.")),
    h("button", { class: "btn", onclick: discard }, "Discard"),
    h("button", { class: "btn primary", id: "savebtn", onclick: () => save(false) }, "Save to node"));
}
function renderNavBadge() {
  const n = countChanges(buildPayload());
  document.querySelectorAll("nav .badge").forEach(b => b.remove());
  if (n) { const b = [...document.querySelectorAll("nav button")].filter(x => ["mqtt", "channels", "device"].includes(x.dataset.tab)); /* changes can be on several tabs */
    const p = buildPayload();
    const on = { mqtt: !!(p.mqtt), channels: !!p.channels, device: !!(p.lora || p.owner) };
    b.forEach(x => { if (on[x.dataset.tab]) x.append(h("span", { class: "badge", title: "Unsaved changes" })); }); }
}
function discard() { S.draft = newDraft(S.orig); render(); renderSaveBar(); }

async function save(confirm) {
  const p = buildPayload(); if (confirm) p.confirm = true;
  const btn = $("#savebtn"); if (btn) btn.disabled = true;
  try {
    const r = await post("/api/settings", p);
    closeModal();
    S.notice = { kind: r.changed ? "ok" : "info", text: r.message, warnings: r.warnings || [] };
    S.awaitReload = !!r.changed;
    if (r.changed) { S.orig = null; S.draft = null; }
    S.tab = "dashboard"; render(); renderSaveBar(); pollStatus();
  } catch (e) {
    if (e.status === 409 && e.data) { showConfirm(e.data); }
    else { closeModal(); alertBox("Could not save", e.message); }
    if (btn) btn.disabled = false;
  }
}
function closeModal() { $("#modal").replaceChildren(); }
function alertBox(title, msg) {
  $("#modal").replaceChildren(h("div", { class: "modal" }, h("div", { class: "box" }, h("h3", {}, title), h("p", {}, msg),
    h("div", { class: "row", style: "justify-content:flex-end" }, h("button", { class: "btn", onclick: closeModal }, "Close")))));
}
function showConfirm(d) {
  $("#modal").replaceChildren(h("div", { class: "modal" }, h("div", { class: "box" },
    h("h3", {}, "Please confirm"),
    h("div", { class: "banner bad" }, h("ul", { style: "margin:0 0 0 18px;padding:0" }, d.risks.map(r => h("li", {}, r)))),
    h("table", {}, h("tr", {}, h("th", {}, "Setting"), h("th", {}, "From"), h("th", {}, "To")),
      d.changes.map(c => h("tr", {}, h("td", {}, `${c.section}: ${c.label}`), h("td", { class: "mono" }, String(c.old)), h("td", { class: "mono" }, String(c.new))))),
    h("div", { class: "row", style: "justify-content:flex-end;margin-top:14px" },
      h("button", { class: "btn", onclick: closeModal }, "Cancel"),
      h("button", { class: "btn danger", onclick: () => save(true) }, "Apply anyway")))));
}

/* ---------- views ---------- */
function kv(rows) { return h("dl", { class: "kv" }, rows.filter(Boolean).map(([k, v]) => [h("dt", {}, k), h("dd", {}, v)])); }

  if (S.statusErr) { cls = "bad"; txt = "Service unreachable"; }
  else if (st) {
    if (st.state === "connected") { cls = st.broker_connected ? "ok" : "warn"; txt = st.broker_connected ? "Node connected · MQTT up" : "Node connected · MQTT down"; }
    else if (st.state === "connecting") { cls = "warn"; txt = "Connecting to node..."; }
    else if (st.state === "waiting") { cls = "bad"; txt = "Node not connected"; }
    else { txt = st.state; }
  }
  pill.className = "pill " + cls; t.textContent = txt;
  const n = st && st.node; $("#nodename").textContent = n && n.long_name ? n.long_name : "";
}

async function loadSettings() {
  if (S.settingsLoading) return; S.settingsLoading = true; S.settingsErr = null;
  try { S.orig = await api("/api/settings"); S.draft = newDraft(S.orig); S.awaitReload = false; }
  catch (e) { S.settingsErr = e.message; }
  S.settingsLoading = false;
  if (["mqtt", "channels", "device"].includes(S.tab)) render();
  renderSaveBar();
}

let lastState = null;
async function pollStatus() {
  if (document.hidden) return;
  try {
    S.status = await api("/api/status"); S.statusErr = null;
    if (S.status.state === "connected" && lastState !== "connected") {
      // The node (re)connected: refresh settings unless the user is mid-edit.
      if (!S.draft || (S.awaitReload && countChanges(buildPayload()) === 0)) { S.orig = null; S.draft = null; S.settingsErr = null; if (["mqtt", "channels", "device"].includes(S.tab)) loadSettings(); }
      if (S.notice && S.awaitReload) { S.notice = { kind: "ok", text: "The node rebooted and the proxy has reconnected. Your changes are active.", warnings: [] }; S.awaitReload = false; }
    }
    lastState = S.status.state;
  } catch (e) { S.statusErr = e.message; }
  renderHeader();
  if (S.tab === "dashboard") render();
  else if (S.settingsErr && S.status && S.status.state === "connected" && ["mqtt", "channels", "device"].includes(S.tab)) loadSettings();
}

render(); renderHeader();
pollStatus(); setInterval(pollStatus, 2500); setInterval(pollLogs, 2000); setInterval(pollNodes, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollStatus(); });
</script>
</body>
